name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: NPM audit
        run: pnpm run audit:npm

      - name: Frontend tests
        run: pnpm run test -- --run

      - name: Frontend build
        run: pnpm run build

  rust-audit:
    name: Rust Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable as of 2026-10-06

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        run: |
          # quick-xml >=0.41 is not yet reachable through the current Tauri/plist dependency chain.
          cargo audit --file src-tauri/Cargo.lock \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

  rust-build-test:
    name: Rust Build and Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable as of 2026-10-06

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust build
        run: cargo build --manifest-path src-tauri/Cargo.toml

  native-keyboard-copy:
    name: Native Keyboard and Copy (macOS)
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      ACCEPTANCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable as of 2026-10-06

      - name: Restore locked frontend
        run: pnpm install --frozen-lockfile

      - name: Prove shipping dependency graph excludes test listener
        shell: bash
        run: |
          mkdir -p native-acceptance-artifacts
          cargo tree --manifest-path src-tauri/Cargo.toml --locked --no-default-features --prefix none > native-acceptance-artifacts/shipping-graph.txt
          python3 - <<'PY'
          import pathlib
          graph = pathlib.Path('native-acceptance-artifacts/shipping-graph.txt').read_text()
          assert 'tauri-plugin-wdio-webdriver' not in graph
          capabilities = pathlib.Path('src-tauri/capabilities/default.json').read_text()
          assert 'wdio' not in capabilities
          PY

      - name: Build explicit debug test application with real production handlers
        run: pnpm tauri build --debug --no-bundle --features native-acceptance --config tests/native/tauri.native-test.conf.json

      - name: Establish isolated account, empty app data and synthetic-only history
        run: python3 tests/native/prepare.py

      - name: WebDriver navigation and real Rust copy to host clipboard
        run: node tests/native/native-story.mjs

      - name: Preserve native source, runner, screenshots and clipboard proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-keyboard-copy-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-acceptance-artifacts/
